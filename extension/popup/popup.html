<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>篝火采集</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #2563eb; --ink: #1e293b; --muted: #64748b; --line: #e2e8f0; --ok: #16a34a; --err: #dc2626; --warn: #b45309; }
    html { width: 320px; }
    body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', 'PingFang SC', sans-serif; color: var(--ink); background: #fff; }
    header { padding: 12px 16px; background: var(--accent); color: #fff; }
    header h1 { font-size: 15px; font-weight: 600; }
    header span { font-size: 11px; opacity: .85; }
    .status { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #f1f5f9; color: var(--muted); font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; flex: none; }
    .dot.active { background: var(--ok); } .dot.error { background: var(--err); } .dot.warning { background: #f59e0b; }
    main { padding: 14px 16px; display: grid; gap: 10px; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .card small { color: var(--muted); display: block; margin-bottom: 2px; }
    .name { font-weight: 500; word-break: break-all; }
    .empty { color: var(--muted); }
    .url { color: var(--muted); font-size: 12px; word-break: break-all; }
    .warn-tag { display: inline-block; margin: 4px 4px 0 0; font-size: 11px; color: var(--warn); background: #fef3c7; padding: 0 6px; border-radius: 4px; }
    button { font: inherit; padding: 9px 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; color: var(--ink); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #feedback { min-height: 20px; font-size: 12px; text-align: center; color: var(--muted); }
    #feedback.success { color: var(--ok); } #feedback.error { color: var(--err); } #feedback.warning { color: var(--warn); }
    footer { padding: 8px 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <header><h1>篝火采集</h1><span>1688 / 淘宝 / 天猫 · v0.1.0</span></header>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusLabel">初始化中…</span></div>
  <main>
    <div class="card"><small>当前页面</small><div class="url" id="currentUrl">—</div></div>
    <div class="card"><small>上次采集</small><div id="lastProductArea"><div class="empty">暂无采集记录</div></div></div>
    <div id="feedback">&nbsp;</div>
    <button class="primary" id="btnCollect" disabled>采集当前商品</button>
    <div class="row">
      <button id="btnFlush" style="display:none">重新发送暂存</button>
      <button id="btnOpenApp">打开桌面应用</button>
    </div>
  </main>
  <footer>数据只发到本机 127.0.0.1，不经过任何服务器。登录和验证请自己在页面里完成。</footer>
  <script src="popup.js"></script>
</body>
</html>
